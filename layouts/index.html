{{ define "main" }}
<div class="hero animate-in">
  <svg class="hero-dragon" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Coiled red dragon sigil">
    <!-- outer rune circle -->
    <circle class="rune" cx="100" cy="100" r="92" fill="none" stroke-width="1" stroke-dasharray="2 6"/>
    <circle class="rune" cx="100" cy="100" r="80" fill="none" stroke-width="1"/>

    <!-- coiled serpentine dragon body, ouroboros-style -->
    <path class="scale-dark" d="M100 30
      C140 30 165 55 165 90
      C165 118 148 132 128 136
      C138 140 144 150 140 162
      C136 174 120 178 108 168
      C118 164 120 154 112 148
      C96 158 74 158 60 146
      C48 136 46 118 56 106
      C44 108 34 100 34 86
      C34 66 54 50 78 50
      C70 58 68 70 76 78
      C64 82 58 94 64 106
      C56 108 50 118 56 128
      C40 116 36 92 48 74
      C58 60 74 52 92 52
      C74 62 70 80 82 92
      C70 96 66 110 76 120
      C88 128 104 128 114 120
      C126 112 128 96 118 86
      C130 84 138 72 132 60
      C126 48 112 42 100 46
      C108 40 96 32 100 30 Z"/>

    <!-- head -->
    <path class="scale" d="M100 46
      C112 42 126 48 132 60
      C138 72 130 84 118 86
      C122 78 118 68 108 64
      C112 72 108 80 100 82
      C92 80 88 72 92 64
      C82 68 78 78 82 86
      C70 84 62 72 68 60
      C74 48 88 42 100 46 Z"/>

    <!-- horns -->
    <path class="scale-dark" d="M92 44 L86 28 L94 40 Z"/>
    <path class="scale-dark" d="M108 44 L114 28 L106 40 Z"/>

    <!-- wing, single stylized fold facing outward -->
    <path class="scale-dark" opacity="0.85" d="M140 90
      C160 84 176 92 180 108
      C168 104 156 106 148 114
      C158 112 166 118 168 128
      C154 126 144 118 140 108
      C142 102 141 96 140 90 Z"/>

    <!-- eyes, one visible on head + one on the far coil to suggest more than one watcher -->
    <circle class="eye" cx="94" cy="64" r="3"/>
    <circle class="eye" cx="106" cy="64" r="3" style="animation-delay:1.1s"/>
    <circle class="eye" cx="60" cy="120" r="2.2" style="animation-delay:1.8s"/>
  </svg>

  <div class="hero-text">
    <h1>{{ .Site.Title }}</h1>
    {{ with .Site.Params.tagline }}<p class="hero-tagline">{{ . }}</p>{{ end }}
  </div>
</div>

<article class="about-page animate-in animate-in-delay-1">
  {{ .Content }}
</article>

<nav class="home-links animate-in animate-in-delay-2">
  <a class="home-link" href="{{ "/blog/" | relURL }}">
    <span class="home-link-icon">✍️</span>
    <span class="home-link-title">بلاگ</span>
    <span class="home-link-desc">یادداشت‌های کوتاه‌تر، افکار، به‌روزرسانی‌ها</span>
  </a>
  <a class="home-link" href="{{ "/novels/" | relURL }}">
    <span class="home-link-icon">📚</span>
    <span class="home-link-title">رمان‌ها</span>
    <span class="home-link-desc">داستان‌های بلند، فصل به فصل</span>
  </a>
  <a class="home-link" href="{{ "/knowledge/" | relURL }}">
    <span class="home-link-icon">🧠</span>
    <span class="home-link-title">دانش‌نامه</span>
    <span class="home-link-desc">یادداشت‌های مرجع، هم‌گام از Obsidian</span>
  </a>
</nav>
{{ end }}
